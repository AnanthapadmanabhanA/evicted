[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evicted"
version = "0.1.0"
description = "Tests whether a removed user actually loses access to a smart-home device (sharing/revoke/transfer lifecycle)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ email = "ananthucbz@gmail.com" }]
dependencies = []  

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
evicted = "evicted.cli:main"

[tool.setuptools]
packages = ["evicted"]
